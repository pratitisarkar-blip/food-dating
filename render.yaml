services:
  - type: web
    name: food-dating
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CONTROLLER_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
